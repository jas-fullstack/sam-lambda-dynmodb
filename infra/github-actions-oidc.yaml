AWSTemplateFormatVersion: "2010-09-09"
Description: GitHub Actions OIDC role for SAM deploy

Parameters:
  GitHubOrg:
    Type: String
    Description: GitHub username or organization
  GitHubRepo:
    Type: String
    Default: sam-lambda-dynmodb
    Description: GitHub repository name
  GitHubOrgId:
    Type: String
    Default: "13570060"
    Description: Numeric GitHub user/org id
  GitHubRepoId:
    Type: String
    Default: "1358871601"
    Description: Numeric GitHub repository id

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - fffffffffffffffffffffffffffffffffffffff

  GitHubActionsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: github-actions-sam-deploy
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubOrg}@${GitHubOrgId}/${GitHubRepo}@${GitHubRepoId}:*
      Policies:
        - PolicyName: SamDeploy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - cloudformation:*
                  - lambda:*
                  - apigateway:*
                  - s3:*
                  - dynamodb:*
                  - iam:GetRole
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:PassRole
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:GetRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:UpdateAssumeRolePolicy
                  - iam:CreateServiceLinkedRole
                Resource: "*"

Outputs:
  RoleArn:
    Description: Add this as GitHub secret AWS_ROLE_ARN
    Value: !GetAtt GitHubActionsRole.Arn
